name: PalanceKit Tests

# Runs on every push/PR (no path filter): the suite includes GoldenParityTests,
# which reads test-fixtures/ — the same vectors the Worker's logic tests use, so
# a fixture change must exercise this job too.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Two compilers (`CHECKLIST.md` "Test framework rebuild" step 6):
    # - 6.0, the floor `Package.swift`'s swift-tools-version promises;
    # - 6.4, what Xcode on the dev Mac runs, so a Linux-only difference at
    #   the version actually used locally can't hide.
    # Swift 6.0 alone once failed here for six weeks (a type-checker timeout
    # in a @Test macro) while the Mac's newer compiler — and so `make check` —
    # stayed green.
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0", "6.4"]
    name: PalanceKit (Swift ${{ matrix.swift }}, Linux)
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}-noble
    steps:
      - uses: actions/checkout@v4
      - name: Run PalanceKit Tests
        run: swift test --package-path PalanceKit

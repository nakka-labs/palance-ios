# XcodeGen project definition — the source of truth for Palance.xcodeproj.
#
# The generated `Palance.xcodeproj` (and `Palance/Info.plist`) are gitignored;
# this YAML is what's version-controlled. Reviewable in diffs, no .pbxproj merge
# conflicts, and every setting is explicit rather than buried in Xcode's UI.
# (It originally also let the project be authored on Windows, where there's no
# Xcode — that's no longer why it's here, but it's a nice property.)
#
# If you'd rather check in a real .xcodeproj: `xcodegen generate`, remove the
# ignore lines in ../.gitignore, drop xcodegen from the Makefile / pre-push hook,
# commit the .xcodeproj, and delete this file.
#
# Setup (one-time): `brew install xcodegen`
# Generate + open:  `cd App && xcodegen generate && open Palance.xcodeproj`
#                   (or just `make hooks` — `xcodegen generate` runs in the hook)

name: Palance
options:
  bundleIdPrefix: com.palance
  deploymentTarget:
    iOS: "17.0"

# Project-wide defaults, inherited by every target below unless a target's
# own `settings.base` overrides a key (`PRODUCT_BUNDLE_IDENTIFIER` always
# does). MARKETING_VERSION/CURRENT_PROJECT_VERSION used to be duplicated
# separately in Palance's and PalanceWidgetExtension's own settings blocks —
# a real App Store requirement is that an extension's version matches its
# container app's, and nothing enforced that beyond remembering to bump both
# lines by hand. One value here can't drift.
#
# Bump CURRENT_PROJECT_VERSION with `make bump-build` before every Xcode
# Archive (never by hand — it's arithmetic on a string, easy to fat-finger).
# MARKETING_VERSION is a deliberate version-number decision, not touched by
# that target.
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: UK652GNPP7
    CODE_SIGN_STYLE: Automatic

packages:
  PalanceKit:
    path: ../PalanceKit

targets:
  Palance:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Palance
    dependencies:
      - package: PalanceKit
        product: PalanceKit
      - target: PalanceWidgetExtension
        embed: true
    # Sign in with Apple (ACCOUNTS_DESIGN.md §5) + push notifications
    # (FEATURE_BACKLOG.md) + CloudKit backup (CHECKLIST.md "CloudKit backup,
    # tier 2"). Generated by `xcodegen` and gitignored like Info.plist. Every
    # capability must also be enabled on the App ID in the Apple Developer
    # portal before a TestFlight build — push additionally needs an APNs Auth
    # Key generated there and set as the worker's `APNS_*` secrets
    # (`CHECKLIST.md` "Enable real push delivery"; until then
    # `didRegisterForRemoteNotificationsWithDeviceToken` never fires, which is
    # harmless). CloudKit needs the `iCloud.com.palance.app` container created
    # in the portal / CloudKit Dashboard; until then `CKContainer.accountStatus`
    # / the backup write fail and `CloudKitGroupBackup` silently no-ops —
    # everything else works unaffected. App Groups is the one exception that's
    # *not* fully blocked on the portal: Xcode's automatic signing can create
    # the group id itself for a local/Simulator build.
    # `aps-environment: development` matches a local Xcode build's sandbox
    # device tokens; Xcode rewrites it to `production` automatically for an
    # Archive build, same as automatic signing handles provisioning.
    entitlements:
      path: Palance/Palance.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.palance.app
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.palance.app
        # Universal Links (`CHECKLIST.md` "Custom domain + Universal Links").
        # `AppConfig.shareLinkBaseURL` builds share links at this host; the AASA
        # is served from the `nakka-labs/palance-website` Pages repo, scoped to
        # `/g/*`. The Associated Domains capability must also be enabled on the
        # `com.palance.app` App ID in the Apple Developer portal before a
        # TestFlight build — same portal caveat as the capabilities above. Until
        # then the `palance://g/:id` scheme below still works for Simulator
        # testing.
        com.apple.developer.associated-domains:
          - applinks:palance.nakka.dev
    info:
      path: Palance/Info.plist
      properties:
        CFBundleDisplayName: Palance
        # Reference the build settings so a version bump is a one-line change in
        # `settings.base` below — never a frozen literal in the generated plist.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The portfolio display face (`DESIGN_BIBLE.md` §1) — Space Grotesk,
        # self-hosted (SIL OFL), used only for the wordmark + hero numerals
        # via `Font.display(...)`. Static instances sliced from the Google
        # Fonts variable font; `Resources/Fonts/OFL.txt` ships alongside.
        UIAppFonts:
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
        # Branded launch screen: the white "=" mark centred on the brand blue
        # (same asset colour as the app icon). Minimal, no text — HIG-compliant,
        # not a splash ad. `LaunchLogo` / `AccentColor` are in Assets.xcassets.
        UILaunchScreen:
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
          UIColorName: AccentColor
        # The app only talks HTTPS (exempt encryption), so no annual
        # self-classification is needed. Declaring this here skips the
        # export-compliance prompt on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        # Lets a backgrounded/suspended app be woken to process a combined
        # alert + `content-available` push and fold the carried balance into
        # the dashboard cache (`AppDelegate.application(_:didReceiveRemote…)`,
        # `CHECKLIST.md` "iOS: push handler writes the carried balance"). An
        # Info.plist key only — no Apple Developer portal capability beyond
        # the `aps-environment` entitlement already declared above.
        UIBackgroundModes:
          - remote-notification
        # `palance://g/<groupId>` deep link scheme — the fallback path and the
        # only one testable in the Simulator (`xcrun simctl openurl booted
        # "palance://g/<groupId>?token=<t>"`). The real share link is a Universal
        # Link (`https://palance.nakka.dev/g/:groupId`) — see the
        # `associated-domains` entitlement above and `AppConfig.shareLinkBaseURL`.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [palance]
            CFBundleURLName: com.palance.app
          # Google Sign-In redirect (MANDATORY_LOGIN_PLAN.md Part 1) — the
          # reversed form of AppConfig.googleClientID. Required for
          # ASWebAuthenticationSession's callback; no Google SDK involved.
          - CFBundleURLSchemes: [com.googleusercontent.apps.785063933196-ieaukpoat5r6v5jjr65315o9rniaaahn]
            CFBundleURLName: com.palance.app.google
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palance.app
        # iPhone only. Doesn't hoist to the project-wide settings above —
        # xcodegen silently widens it back to "1,2" (universal) there,
        # apparently applying its own per-target iOS default *after* project
        # settings but before target settings, so it has to live here.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Home-screen widget (`FEATURE_BACKLOG.md`) — glanceable "you owe / you're
  # owed" for the most-recently-opened group. Reads a snapshot the app
  # writes on every refetch (`GroupViewModel.updateWidgetSnapshot`,
  # `PalanceKit`'s `WidgetSnapshotStoring`) from the shared App Group
  # container; makes no network calls of its own ("lightweight refresh
  # path").
  PalanceWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PalanceWidget
      # Shared with the Palance target — the extension's only channel for
      # AppConfig.appGroupID/sharedDefaults/balanceWidgetKind.
      - path: Palance/AppConfig.swift
    dependencies:
      - package: PalanceKit
        product: PalanceKit
    entitlements:
      path: PalanceWidget/PalanceWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.palance.app
    info:
      path: PalanceWidget/Info.plist
      properties:
        CFBundleDisplayName: Palance Balance
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palance.app.widget
        TARGETED_DEVICE_FAMILY: "1" # see Palance's own settings comment
        SKIP_INSTALL: "YES"

  # App-level unit tests (deep-link parsing, group-not-found handling). Pure
  # XCTest, no Simulator UI — runs anywhere, including `ios-build.yml`.
  PalanceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PalanceTests
    dependencies:
      - target: Palance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.palance.app.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Palance:
    build:
      targets:
        Palance: all
        PalanceWidgetExtension: all
        PalanceTests: [test]
    test:
      targets:
        - PalanceTests
